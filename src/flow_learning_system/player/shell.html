<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* 레이아웃: 상단 바 + [접히는 목차 | 무대(모션 그래픽) | 접히는 대본 ≈ 1/5]. 무대는 테마와 무관하게 늘 어두운 화면 */
:root {
  --bg: #EDF0F4; --panel: #FFFFFF; --ink: #17202A; --muted: #5C6773; --line: #D6DDE5;
  --accent: #6447D6; --accent-soft: #ECE8FD; --on-accent: #FFFFFF; --done: #2E8B57;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --bar-h: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0E13; --panel: #11171E; --ink: #E2E8EE; --muted: #8D99A5; --line: #232D38;
  --accent: #A48EFF; --accent-soft: #241D44; --on-accent: #140C30; --done: #5CC98D; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A0E13; --panel: #11171E; --ink: #E2E8EE; --muted: #8D99A5; --line: #232D38;
  --accent: #A48EFF; --accent-soft: #241D44; --on-accent: #140C30; --done: #5CC98D; color-scheme: dark;
}
/* 무대 전용 토큰 (항상 어두운 화면) */
.stage {
  --paper: #18222C; --paper2: #1D2833; --ink: #E5ECF0; --muted: #91A2AC; --line: #2D3A46;
  --accent: #F2C14E; --accent-soft: #3B3218; --on-accent: #1A1405;
  --hl-bg: #4D3D0C; --hl-bd: #F2C14E; --ok-bg: #12382A; --ok-bd: #3FBF84; --ok-fg: #8EE2B8;
  --bad-bg: #44201C; --bad-bd: #EF6F5E; --bad-fg: #F7A79B;
  --g1-bg: #182F50; --g1-bd: #5E9BF0; --g2-bg: #33204D; --g2-bd: #B385EE; --g3-bg: #44301A; --g3-bd: #E7A15C;
  --val: #3FC1B0; --ref: #B385EE;
  --wall: #5C6E77; --land: #4D6345; --sea: #1A2B33;
  --code-bg: #0B1218; --code-fg: #D8E3E6; --code-ln: #4D6370; --code-on: rgba(242, 193, 78, .16); --code-bar: #F2C14E;
  --c-k: #7BCFC4; --c-t: #F0C677; --c-s: #E8A07A; --c-n: #C5A4F2; --c-c: #6E8892;
  --s-bg: #0F161E; --s-edge: #22303C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-variant-ligatures: none; font-family: var(--f-mono); font-size: .9em; background: var(--paper2, var(--bg)); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; }

/* 상단 바 */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.bar-in { height: var(--bar-h); display: flex; align-items: center; gap: 4px; }
.ib { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 9px; display: grid; place-items: center; cursor: pointer; flex: none; }
.ib:hover { background: var(--bg); }
.ib:disabled { opacity: .35; cursor: default; background: transparent; }
.ib svg { width: 20px; height: 20px; fill: currentColor; }
.ib.on { color: var(--accent); background: var(--accent-soft); }
.ib.play { background: var(--accent); color: var(--on-accent); width: 44px; height: 36px; border-radius: 18px; }
.ib.play:hover { background: var(--accent); filter: brightness(1.08); }
.lt { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 0 8px; }
.lt .no { font: 700 13px var(--f-mono); color: var(--accent); flex: none; }
.lt .tt { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt .sb { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl { display: flex; align-items: center; gap: 2px; flex: none; }
.rate { height: 32px; border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 0 8px; font: 600 12px var(--f-mono); cursor: pointer; margin: 0 4px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; flex: none; }

/* 3단 */
.app { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar-h) + 1px + env(safe-area-inset-top, 0px)); display: grid;
  grid-template-columns: var(--idx-w, 272px) minmax(0, 1fr) var(--scr-w, clamp(240px, 20vw, 360px)); transition: grid-template-columns .28s ease; }
.app.no-idx { --idx-w: 0px; } .app.no-scr { --scr-w: 0px; }
.panel { background: var(--panel); min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.idx { border-right: 1px solid var(--line); }
.scr { border-left: 1px solid var(--line); }
.app.no-idx .idx, .app.no-scr .scr { border: 0; }
.p-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 8px 16px; border-bottom: 1px solid var(--line); flex: none; }
.p-h b { font-size: 13px; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.p-b { overflow-y: auto; padding: 8px 10px 24px 12px; flex: 1; min-width: 240px; }
.scr .p-b { min-width: 220px; }

/* 목차 */
.grp { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin: 16px 6px 6px; }
.grp:first-child { margin-top: 6px; }
.les { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
.les:hover { background: var(--bg); }
.les.cur { background: var(--accent-soft); }
.les .n { font: 700 12px var(--f-mono); color: var(--muted); }
.les.cur .n { color: var(--accent); }
.les .t { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.les .m { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.les.done .m::before { content: "✓ "; color: var(--done); }
.secs { margin: 2px 0 8px 38px; display: grid; gap: 1px; }
.sec { text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
.sec:hover { background: var(--bg); color: var(--ink); }
.sec.cur { color: var(--accent); font-weight: 600; }
.opt { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); padding: 12px 8px 0; cursor: pointer; }
.opt input { accent-color: var(--accent); width: 16px; height: 16px; }

/* 대본 */
.s-sec { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--accent); margin: 14px 4px 4px; }
.s-sec:first-child { margin-top: 4px; }
.sl { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 6px 8px; font-size: 13.5px; line-height: 1.6; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; }
.sl:hover { background: var(--bg); }
.sl.cur { background: var(--accent-soft); color: var(--ink); }
.sl.past { color: var(--ink); opacity: .72; }
.sl code { font-size: .86em; }

/* 무대 */
.stagewrap { min-width: 0; display: flex; flex-direction: column; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); gap: 10px; }
.stage { flex: 1; min-height: 0; background: var(--s-bg); color: var(--ink); border: 1px solid var(--s-edge); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.st-top { display: flex; align-items: center; gap: 10px; padding: 12px 18px 0; font-size: 12px; color: var(--muted); }
.st-sec { font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.st-cnt { margin-left: auto; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.st-head { padding: 6px 18px 12px; font: 700 clamp(19px, 2.1vw, 27px)/1.35 var(--f-body); letter-spacing: -.01em; text-wrap: balance; min-height: 2.2em; }
.st-head code { font-size: .85em; background: transparent; border: 0; padding: 0; color: var(--accent); }
.st-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; padding: 0 18px 16px; overflow: auto; }
.st-body.nocode { grid-template-columns: minmax(0, 1fr); }
.st-body.nocode .cpane { display: none; }
.cpane { min-width: 0; display: flex; flex-direction: column; }
pre.code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; margin: 0; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; font: 14px/1.7 var(--f-mono); overflow: auto; max-height: 100%; }
.ln { display: block; padding-right: 16px; white-space: pre; transition: background .3s, opacity .3s; }
.ln i { display: inline-block; width: 3em; padding-right: 14px; text-align: right; color: var(--code-ln); font-style: normal; user-select: none; }
.ln.on { background: var(--code-on); box-shadow: inset 4px 0 0 var(--code-bar); }
.ln.on i { color: var(--code-bar); font-weight: 700; }
.code.focus .ln:not(.on) { opacity: .55; }
.code .k { color: var(--c-k); } .code .t { color: var(--c-t); } .code .s { color: var(--c-s); } .code .n { color: var(--c-n); } .code .c { color: var(--c-c); font-style: italic; }
.vpane { min-width: 0; position: relative; }
.wv { padding-top: 12px; display: grid; gap: 14px; justify-items: start; align-content: start; }
.st-body.nocode .wv { justify-items: center; }
.wv > * { max-width: 100%; }
.wobj { max-width: 100%; overflow-x: auto; }
.wboard { max-width: 100%; overflow-x: auto; }
.otag { font: 600 10.5px var(--f-mono); color: var(--ref); border: 1px solid var(--ref); border-radius: 5px; padding: 0 5px; margin-right: 6px; }
.wret { font: 700 17px var(--f-mono); background: var(--ok-bg); border: 1.5px solid var(--ok-bd); color: var(--ok-fg); border-radius: 9px; padding: 6px 16px; }
.wtrace { max-width: 100%; overflow-x: auto; }
/* 변수 상자 */
.vvars { display: flex; flex-wrap: wrap; gap: 10px; }
.vbox { position: relative; display: inline-flex; flex-direction: column; align-items: center; min-width: 78px; padding: 16px 14px 7px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--paper); transition: background .3s, border-color .3s; }
.vbox .vt { position: absolute; top: -9px; left: 10px; font: 700 10.5px var(--f-mono); padding: 0 6px; border-radius: 5px; background: var(--s-bg); color: var(--muted); border: 1px solid var(--line); }
.vbox.val .vt { color: var(--val); border-color: var(--val); }
.vbox.ref .vt { color: var(--ref); border-color: var(--ref); }
.vbox .vn { font: 500 12px var(--f-mono); color: var(--muted); }
.vbox b { font: 700 19px var(--f-mono); white-space: nowrap; display: inline-block; }
.vbox.hl { background: var(--hl-bg); border-color: var(--hl-bd); }
.vbox.ok { background: var(--ok-bg); border-color: var(--ok-bd); }
.vref { color: var(--ref); font-size: 16px; }
/* 콘솔 */
.vcon { width: min(100%, 460px); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: #070B0F; }
.vcon-t { font: 600 11px var(--f-mono); color: var(--muted); padding: 5px 12px; border-bottom: 1px solid var(--line); letter-spacing: .06em; }
.vcon-b { padding: 8px 12px; font: 14px/1.6 var(--f-mono); color: #CFE8D9; max-height: 220px; overflow: auto; }
.vcl { white-space: pre; }
.vcl.new { color: var(--accent); }
.vcl.dim { color: var(--muted); }
/* 카드, 막대, 오류 */
.vcards { display: flex; flex-wrap: wrap; gap: 10px; }
.vcard { border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); padding: 10px 14px; min-width: 120px; max-width: 280px; }
.vcard-t { font: 700 15px var(--f-mono); margin-bottom: 2px; }
.vcard-b { font-size: 13.5px; color: var(--muted); }
.vcard.g1, .vcard.g2, .vcard.g3, .vcard.hl, .vcard.ok, .vcard.bad { background: var(--c-bg); border-color: var(--c-bd); }
.vcard.g1 .vcard-b, .vcard.g2 .vcard-b, .vcard.g3 .vcard-b, .vcard.hl .vcard-b, .vcard.ok .vcard-b, .vcard.bad .vcard-b { color: var(--ink); }
.vcard.dim { opacity: .45; }
.vbars { display: grid; gap: 8px; width: min(100%, 560px); }
.vbar-r { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.vbar-n { color: var(--muted); text-align: right; }
.vbar-t { height: 18px; background: var(--paper); border-radius: 5px; overflow: hidden; }
.vbar-b { height: 100%; background: var(--g1-bd); border-radius: 5px; }
.vbar-b.bad { background: var(--bad-bd); } .vbar-b.ok { background: var(--ok-bd); } .vbar-b.g1 { background: var(--g1-bd); }
.vbar-v { font: 12px var(--f-mono); color: var(--ink); white-space: nowrap; }
.verr { font-size: 14px; background: var(--bad-bg); border: 1.5px solid var(--bad-bd); color: var(--bad-fg); border-radius: 10px; padding: 7px 14px; max-width: 100%; }
.verr::before { content: "⚠ "; }
/* 큰 재생 버튼 */
.bigplay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 12, 16, .55); border: 0; cursor: pointer; z-index: 6; color: #fff; }
.bigplay span { display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 17px; padding: 14px 26px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.bigplay svg { width: 22px; height: 22px; fill: currentColor; }
/* 타임라인 */
.tl { flex: none; display: flex; align-items: center; gap: 10px; }
.tl-track { flex: 1; display: flex; gap: 2px; height: 22px; align-items: center; cursor: pointer; min-width: 0; }
.tl-seg { position: relative; height: 6px; background: var(--line); border-radius: 3px; flex: 1 1 0; transition: height .15s; overflow: hidden; }
.tl-seg.sec0 { margin-left: 5px; }
.tl-seg > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
.tl-seg.past > i { width: 100%; }
.tl-track:hover .tl-seg { height: 10px; }
.tl-time { font: 600 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 60; }

@media (min-width: 1200px) and (min-height: 760px) {
  pre.code { font-size: 15.5px; }
  .vbox { min-width: 92px; padding: 18px 16px 8px; } .vbox b { font-size: 23px; } .vbox .vn { font-size: 13px; }
  .va .val td { min-width: 50px; height: 50px; font-size: 18px; } .va .ix td, .va .ptr td { font-size: 12.5px; }
  .vg td { width: 50px; height: 50px; font-size: 16px; }
  .vf-b { font-size: 16px; padding: 7px 14px; } .veq { font-size: 16.5px; padding: 9px 16px; }
  .vcard-t { font-size: 17px; } .vcard-b { font-size: 14.5px; } .vcard { max-width: 320px; }
  .vt { font-size: 15px; } .vt th { font-size: 13.5px; }
  .vs-it { font-size: 16px; padding: 6px 16px; } .vk-i span, .vk-i b { font-size: 15px; }
  .vcon-b { font-size: 15.5px; } .verr { font-size: 15.5px; }
  .vch .vf-b { font-size: 16px; }
}

/* 과목 공통 위젯 */
.en { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.04em; color: var(--accent, #6447D6); }
.stage .en { color: #9FD3FF; }
.math { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 1.12em; white-space: nowrap; }
.math i { font-style: italic; }
.math sup, .math sub { font-size: .68em; }
.mfrac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .12em; }
.mfrac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
.mfrac > span { font-size: .9em; line-height: 1.25; }
.msqrt { white-space: nowrap; } .mrt { border-top: 1.5px solid currentColor; padding: 0 .12em; }
.mfn { font-style: normal; margin-right: .12em; } .mq { display: inline-block; width: 1em; } .mtext { font-family: var(--f-body); font-style: normal; font-size: .82em; }
.mhl { border-radius: 5px; padding: 0 .12em; }
.mhl.hl { background: var(--hl-bg); color: #FFE7A0; } .mhl.ok { background: var(--ok-bg); color: var(--ok-fg); } .mhl.bad { background: var(--bad-bg); color: var(--bad-fg); }
.mhl.g1 { background: var(--g1-bg); } .mhl.g2 { background: var(--g2-bg); } .mhl.g3 { background: var(--g3-bg); } .mhl.dim { opacity: .4; }
.vmath { display: grid; gap: 8px; }
.vml { font-size: 24px; padding: 6px 16px; border-radius: 10px; border: 1.5px solid transparent; }
.vmath.big .vml { font-size: 32px; }
.vml.hl { background: var(--hl-bg); border-color: var(--hl-bd); } .vml.ok { background: var(--ok-bg); border-color: var(--ok-bd); } .vml.dim { opacity: .4; }
.vplotw { max-width: 100%; }
.vplot .pg { stroke: var(--line); stroke-width: 1; } .vplot .pg.ax { stroke: var(--muted); stroke-width: 1.6; }
.vplot .pt { fill: var(--muted); font: 11px var(--f-mono); }
.vplot .plab { font: 700 14px var(--f-body); }
.vtok { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: flex-start; }
.tok { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 14px 6px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--paper); }
.tok .tw { font: 600 20px "Source Serif 4", Georgia, serif; white-space: nowrap; }
.tok .tr { font: 700 11px var(--f-mono); color: var(--muted); letter-spacing: .06em; }
.vtok.big .tok .tw { font-size: 26px; }
.tok.g1, .tok.g2, .tok.g3, .tok.hl, .tok.ok, .tok.bad { background: var(--c-bg); border-color: var(--c-bd); }
.tok.dim { opacity: .35; }
.vimg { position: relative; width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #05080B; }
.vimg-in { position: relative; transition: none; }
.vimg-in img { display: block; width: 100%; height: auto; user-select: none; }
.vimg-ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.vimg-ov .ilab { font: 700 34px var(--f-body); paint-order: stroke; stroke: #05080B; stroke-width: 7px; }
.spot { position: absolute; transform: translate(-50%, -50%); width: 0; height: 0; }
.spot i { position: absolute; left: 0; top: 0; width: calc(26px / var(--z)); height: calc(26px / var(--z)); transform: translate(-50%, -50%); border-radius: 50%; border: calc(3px / var(--z)) solid var(--sp, var(--ok-bd)); box-shadow: 0 0 0 calc(4px / var(--z)) rgba(0,0,0,.35); }
.spot span { position: absolute; top: 0; transform: translateY(-50%) scale(calc(1 / var(--z))); transform-origin: left center; white-space: nowrap; font: 700 15px var(--f-body); color: #0B1218; background: var(--sp, var(--ok-bd)); padding: 3px 10px; border-radius: 8px; left: calc(20px / var(--z)); }
.spot.l span { left: auto; right: calc(20px / var(--z)); transform-origin: right center; }
.spot.hl { --sp: var(--hl-bd); } .spot.ok { --sp: var(--ok-bd); } .spot.bad { --sp: var(--bad-bd); } .spot.g1 { --sp: var(--g1-bd); } .spot.g2 { --sp: var(--g2-bd); } .spot.g3 { --sp: var(--g3-bd); } .spot.dim { --sp: var(--muted); opacity: .6; }
