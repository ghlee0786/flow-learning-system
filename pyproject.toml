[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-learning-system"
version = "0.1.0"
description = "모션 그래픽과 TTS를 활용한 학습 시스템 — 문장 하나가 장면 하나인 교재를 만드는 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ghlee0786" }]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
tts = ["supertonic>=1.3", "numpy"]
dev = ["pytest"]

[project.scripts]
fls = "flow_learning_system.cli:main"
flow-learning-system-mcp = "flow_learning_system.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow_learning_system = ["player/*", "guide.md", "pron_base.json"]
